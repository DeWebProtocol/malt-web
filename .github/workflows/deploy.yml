name: Build VitePress site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitepress-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /malt-web/
      # This repository is currently private on a plan that does not support
      # GitHub Pages. Restore configure-pages, upload-pages-artifact, and
      # deploy-pages when the repository becomes public or Pages-supported.
